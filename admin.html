
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة Dar Mohamed</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5ef;
      color: #20352c;
      padding: 25px;
    }
    .container {
      max-width: 430px;
      margin: 55px auto;
      background: white;
      padding: 28px;
      border-radius: 15px;
      box-shadow: 0 5px 25px #00000012;
    }
    h1 { text-align: center; color: #244d39; }
    p { text-align: center; color: #777; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: #244d39;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    #message { margin-top: 15px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dar Mohamed</h1>
    <p>لوحة إدارة الموقع</p>

    <form id="loginForm">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" required
        placeholder="البريد الإلكتروني">

      <label for="password">كلمة المرور</label>
      <input id="password" type="password" required
        placeholder="كلمة المرور">

      <button type="submit">تسجيل الدخول</button>
    </form>

    <p id="message"></p>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
